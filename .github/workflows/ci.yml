name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  USERNAME: ${{ secrets.CR_USERNAME }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json
      - name: Lint API
        run: cd services/api && npm ci && npm run lint --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json
      - name: Test API
        run: cd services/api && npm ci && npm test --if-present

  build-api:
    name: Build & Scan API
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.CR_USERNAME }} --password-stdin

      - name: Build API image
        run: |
          docker build -t ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-api:${{ github.sha }} \
                       -t ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-api:latest \
                       ./services/api

      - name: Scan API with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-api:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-api:${{ github.sha }}
          docker push ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-api:latest

  build-frontend:
    name: Build & Scan Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.CR_USERNAME }} --password-stdin

      - name: Build Frontend image
        run: |
          docker build -t ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-frontend:${{ github.sha }} \
                       -t ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-frontend:latest \
                       ./services/frontend

      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-frontend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL

      - name: Push Frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-frontend:${{ github.sha }}
          docker push ghcr.io/${{ secrets.CR_USERNAME }}/opspilot-frontend:latest

  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K3s
        run: |
          kubectl rollout restart deployment api
          kubectl rollout restart deployment frontend
          kubectl rollout restart deployment worker
          kubectl rollout status deployment api --timeout=120s
          kubectl rollout status deployment frontend --timeout=120s
          kubectl rollout status deployment worker --timeout=120s

      - name: Verify deployment
        run: kubectl get pods